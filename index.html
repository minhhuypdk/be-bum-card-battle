<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bé Bum – Thẻ Chiến Đấu 2D</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#fff;background:#071637}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 50% 26%,#3279d6 0%,#173e8c 35%,#071637 82%);overflow-x:hidden}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(105deg,transparent 0 95px,#ffffff07 96px 98px),radial-gradient(ellipse at 50% 95%,#4fcbff44,transparent 48%)}main{max-width:940px;min-height:100dvh;margin:auto;padding:clamp(14px,3vw,30px);position:relative}h1{text-align:center;font-size:clamp(30px,6vw,57px);line-height:1.1;margin:14px 0 30px;color:#ffe27b;text-shadow:0 3px #9a5415,0 0 22px #3caaff,0 0 5px #001a55;letter-spacing:-.8px}h2{font-size:clamp(22px,4vw,34px);margin:12px 0 18px;color:#fff}section{background:linear-gradient(155deg,#153a80ee,#071b4de8);border:2px solid #63b9ff;border-radius:25px;padding:clamp(16px,4vw,34px);margin:14px 0;box-shadow:0 0 35px #1aa3ff44,inset 0 0 25px #5ec5ff19;position:relative;overflow:hidden}section:before{content:"";position:absolute;inset:0 0 auto;height:5px;background:linear-gradient(90deg,transparent,#9ffaff,transparent)}section>h2:first-child{text-align:center;text-shadow:0 0 16px #6ed8ff}button{background:linear-gradient(#fff1a7,#ffc23c 50%,#e98e12);color:#192b4d;border:2px solid #fff6c6;border-radius:17px;padding:15px 19px;margin:6px;font-weight:900;font-size:clamp(15px,3vw,19px);box-shadow:0 5px #a45c11,0 0 17px #ffdc6677;cursor:pointer;min-height:54px}button:active{transform:translateY(3px);box-shadow:0 2px #a45c11}input{background:#f4faff;color:#0a2348;border:2px solid #72c7ff;border-radius:10px;padding:11px;margin:6px;max-width:95%;font-size:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px}.tile{background:linear-gradient(#2668b5,#0c2a64);border:2px solid #70c9ff;border-radius:15px;padding:13px;box-shadow:inset 0 0 18px #4db9ff44}.tile img{max-width:100%;height:170px;object-fit:contain}p{line-height:1.5}small{color:#cce9ff}@media(max-width:550px){main{padding:13px}h1{margin:17px 0 22px}section{padding:17px 12px;border-radius:19px}button{display:inline-block;max-width:100%}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.tile{padding:9px}}
.arena{height:clamp(180px,37vw,300px);position:relative;overflow:hidden;border-radius:20px;background:radial-gradient(ellipse at 50% 110%,#5bf2ff 0%,#1a71d7 30%,#13265d 69%,#080f31 100%);border:2px solid #72d9ff;box-shadow:inset 0 0 55px #42caff,0 0 24px #4db7ff55;margin-bottom:23px}.arena:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 29px,#d7ffff22 30px 31px),linear-gradient(0deg,#6eeaff33 0 2px,transparent 3px 100%);transform:perspective(250px) rotateX(18deg) scale(1.2);transform-origin:bottom}.arena:after{content:"";position:absolute;width:72%;height:34%;border:5px solid #9df5ff;border-radius:50%;left:14%;bottom:-6%;box-shadow:0 0 28px #3df9ff,0 0 55px #00aaff}.fighter{position:absolute;bottom:15%;z-index:2;font-size:clamp(70px,15vw,132px);filter:drop-shadow(0 9px 8px #021432)}.fighter.left{left:12%}.fighter.right{right:12%}.versus{position:absolute;left:45%;top:35%;z-index:3;font-size:clamp(35px,7vw,60px);font-weight:1000;color:#ffe074;text-shadow:0 3px #9d491a,0 0 20px #fff}.arena-label{position:absolute;top:14px;left:0;right:0;text-align:center;letter-spacing:3px;font-weight:800;color:#aeefff}.home-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.home-actions button{margin:4px}@media(max-width:480px){.home-actions{grid-template-columns:1fr}.fighter.left{left:7%}.fighter.right{right:7%}}
</style><main><h1>✨ Bé Bum – Thẻ Chiến Đấu 2D</h1><div id="root"></div></main><script>
let cards=JSON.parse(localStorage.getItem('bum_cards')||'[]'),players=[{name:'Bé Bum',team:[],ko:0},{name:'Ba',team:[],ko:0}],turn=0,draw=0,selected=0,guard=[false,false];const root=document.getElementById('root');function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function show(s){root.innerHTML='<section>'+s+'</section>'}function home(){show('<div class="arena"><div class="arena-label">SÂN ĐẤU GIA ĐÌNH</div><span class="fighter left">🧒</span><span class="versus">VS</span><span class="fighter right">👨</span></div><h2>✨ Sẵn sàng chiến đấu!</h2><div class="home-actions"><button onclick="start()">⚔️ BẮT ĐẦU TRẬN ĐẤU</button><button onclick="collection()">🎴 BỘ SƯU TẬP THẺ</button></div><p style="text-align:center;color:#c8eaff">2 người chơi · 1 thiết bị · Thẻ thật của gia đình</p>')} function collection(){show('<h2>Bộ sưu tập ('+cards.length+')</h2><button onclick="add()">+ Thêm thẻ</button><button onclick="home()">Trang chủ</button><div class="grid">'+cards.map(c=>'<div class="tile">'+(c.img?'<img src="'+c.img+'">':'🎴')+'<p>'+esc(c.name)+'</p>HP '+c.hp+' · '+esc(c.attack)+' ('+c.damage+')</div>').join('')+'</div>')}function add(){show('<h2>Thêm thẻ thật</h2><form id="f"><p>Ảnh: <input id="img" type="file" accept="image/*"></p><p>Tên: <input id="name" required></p><p>HP: <input id="hp" type="number" min="1" required></p><p>Chiêu thức: <input id="attack" required></p><p>Sát thương: <input id="damage" type="number" min="0" required></p><button>Lưu</button></form>');document.getElementById('f').onsubmit=async e=>{e.preventDefault();let f=document.getElementById('img').files[0],img='';if(f)img=await new Promise(ok=>{let r=new FileReader;r.onload=()=>ok(r.result);r.readAsDataURL(f)});cards.push({id:Date.now()+Math.random(),img,name:document.getElementById('name').value,hp:+document.getElementById('hp').value,attack:document.getElementById('attack').value,damage:+document.getElementById('damage').value});try{localStorage.setItem('bum_cards',JSON.stringify(cards))}catch(e){alert('Bộ nhớ trình duyệt đầy')}collection()}}function start(){if(cards.length<5){alert('Hãy nhập ít nhất 5 thẻ trước');collection();return}players.forEach(p=>{p.team=[];p.ko=0});show('<h2>Chọn người chơi</h2><p>Người 1 <input id="p0" value="Bé Bum"></p><p>Người 2 <input id="p1" value="Ba"></p><button onclick="names()">Tiếp tục</button>')}function names(){players.forEach((p,i)=>p.name=document.getElementById('p'+i).value||('Người '+(i+1)));draw=0;handoff()}function handoff(){let p=players[draw%2];show('<h2>🔒 Đưa máy cho '+esc(p.name)+'</h2><p>Người còn lại không nhìn màn hình.</p><button onclick="pick()">Sẵn sàng</button>')}function pick(){let p=players[draw%2];show('<h2>'+esc(p.name)+' · Thẻ '+(p.team.length+1)+'/5</h2><div class="grid">'+cards.map((c,i)=>'<button onclick="take('+i+')">'+esc(c.name)+' · HP '+c.hp+'</button>').join('')+'</div>')}function take(i){let p=players[draw%2];if(p.team.some(c=>c.id===cards[i].id)){alert('Thẻ này đã chọn');return}p.team.push({...cards[i],current:cards[i].hp});draw++;if(draw<10)handoff();else{selected=0;starterHandoff()}}function starterHandoff(){show('<h2>🔒 '+esc(players[selected].name)+' chọn thẻ ra sân</h2><button onclick="starter()">Sẵn sàng</button>')}function starter(){show('<h2>Chọn thẻ đầu tiên</h2>'+players[selected].team.map((c,i)=>'<button onclick="choose('+i+')">'+esc(c.name)+'</button>').join(''))}function choose(i){let t=players[selected].team;[t[0],t[i]]=[t[i],t[0]];selected++;if(selected<2)starterHandoff();else{turn=0;guard=[false,false];battle()}}function battle(){let a=players[turn],b=players[1-turn],c=a.team[0],d=b.team[0];show('<h2>⚔️ Lượt '+esc(a.name)+'</h2><div class="grid"><div class="tile"><h3>'+esc(a.name)+'</h3>'+esc(c.name)+'<p>HP '+c.current+'/'+c.hp+'</p></div><div class="tile"><h3>'+esc(b.name)+'</h3>'+esc(d.name)+'<p>HP '+d.current+'/'+d.hp+'</p></div></div><p>KO: '+a.ko+' – '+b.ko+'</p><p>Chiêu '+esc(c.attack)+' · '+c.damage+' sát thương cơ bản</p><button onclick="attack()">Tấn công</button><button onclick="defend()">Phòng thủ</button><button onclick="swap(false)">Đổi thẻ</button>')}function attack(){let c=players[turn].team[0],d=players[1-turn].team[0];let s=prompt('Nhập sát thương thực tế sau khi áp dụng hiệu ứng thẻ:',c.damage);if(s===null)return;let n=Number(s);if(!Number.isFinite(n)||n<0)return alert('Sát thương không hợp lệ');n=Math.floor(n);if(guard[1-turn]){n=Math.max(0,n-30);guard[1-turn]=false}d.current=Math.max(0,d.current-n);if(!d.current){players[turn].ko++;players[1-turn].team.shift();if(players[turn].ko>=3||!players[1-turn].team.length)return win(turn);turn=1-turn;return swap(true)}turn=1-turn;battle()}function defend(){guard[turn]=true;turn=1-turn;battle()}function swap(forced){let p=players[turn];show('<h2>'+esc(p.name)+' chọn thẻ thay thế</h2>'+p.team.map((c,i)=>'<button onclick="swapTo('+i+','+forced+')">'+esc(c.name)+' · '+c.current+' HP</button>').join('')+(forced?'':'<button onclick="battle()">Hủy</button>'))}function swapTo(i,forced){if(!forced&&i===0)return battle();let t=players[turn].team;[t[0],t[i]]=[t[i],t[0]];if(!forced)turn=1-turn;battle()}function win(i){show('<h2>🏆 CHIẾN THẮNG!</h2><h1>'+esc(players[i].name)+'</h1><p>'+players[i].ko+' KO</p><button onclick="start()">Chơi lại</button><button onclick="home()">Trang chủ</button>')}home();
</script></html>
