function importCollectionFile(input){const f=input.files?.[0];if(!f)return;input.value='';if(!authorizeBackup('khôi phục'))return;if(f.size>30e6)return alert('Tệp quá lớn (30MB)');const rd=new FileReader();rd.onload=()=>{try{const d=JSON.parse(rd.result);if(d.format!=='be-bum-cards'||!Array.isArray(d.cards)||d.cards.length>3000||!d.cards.every(c=>c&&typeof c.name==='string'&&(!c.img||typeof c.img==='string'&&c.img.startsWith('data:image/'))))throw Error('Tệp không hợp lệ');if(!confirm('Thay thế '+cards.length+' thẻ hiện tại bằng '+d.cards.length+' thẻ trong bản sao lưu?'))return;localStorage.setItem('bum_cards',JSON.stringify(d.cards));cards=d.cards;collection()}catch(e){alert('Khôi phục thất bại: '+e.message)}};rd.readAsText(f)}

function detectCardClass(text,parsed={}){const lines=String(text||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean),header=lines.slice(0,5).join(' ');let subtype='unknown';if(/\b(?:supporter|supporters)\b/i.test(header))subtype='supporter';else if(/\b(?:stadium)\b/i.test(header))subtype='stadium';else if(/\b(?:pokemon tool|pokémon tool|tool)\b/i.test(header))subtype='tool';else if(/\b(?:special energy|basic energy|energy)\b/i.test(header))subtype='energy';else if(/\b(?:item)\b/i.test(header))subtype='item';const trainer=/\b(?:trainer|supporter|stadium|item|pokemon tool|pokémon tool|special energy|basic energy)\b/i.test(header);const pokemon=/\b(?:basic|stage\s*[12]|mega)\b/i.test(header)||Number(parsed.hp)>0;return {category:trainer?'support':pokemon?'battle':'unknown',subtype,confidence:trainer||pokemon?'suggested':'unknown'}}

function loadOCR(){return new Promise((resolve,reject)=>{if(window.Tesseract)return resolve();let s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';s.onload=()=>window.Tesseract?resolve():reject(new Error('Không tải được thư viện nhận diện'));s.onerror=()=>reject(new Error('Không thể tải thư viện OCR. Cần kết nối Internet.'));document.head.appendChild(s)})}
function shrinkImage(file){return new Promise((resolve,reject)=>{let reader=new FileReader();reader.onerror=()=>reject(new Error('Không đọc được ảnh'));reader.onload=()=>{let img=new Image();img.onerror=()=>reject(new Error('Ảnh không hợp lệ'));img.onload=()=>{let max=1400,scale=Math.min(1,max/Math.max(img.width,img.height)),cv=document.createElement('canvas');cv.width=Math.round(img.width*scale);cv.height=Math.round(img.height*scale);cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);resolve(cv.toDataURL('image/jpeg',.78))};img.src=reader.result};reader.readAsDataURL(file)})}

let scanHeaderText='';
async function readCardHeader(photo,words,worker){try{const tags=(words||[]).filter(w=>/^(BASIC|STAGE|HP)$/i.test(String(w.text||'').trim())&&w.bbox);if(!tags.length)return '';const img=new Image();img.src=photo;await img.decode();const tag=tags.sort((a,b)=>a.bbox.y0-b.bbox.y0)[0];const y=Math.max(0,tag.bbox.y0-img.height*.035),height=Math.min(img.height-y,Math.max(75,img.height*.095));const canvas=document.createElement('canvas');canvas.width=Math.round(img.width*2);canvas.height=Math.round(height*2);canvas.getContext('2d').drawImage(img,0,y,img.width,height,0,0,canvas.width,canvas.height);const out=await worker.recognize(canvas);return out.data.text||''}catch(e){return ''}}
function parseScan(text,headerText=''){
 const lines=String(text||'').split(/\r?\n/).map(x=>x.replace(/\s+/g,' ').trim()).filter(Boolean);
 let name='',hp=0,number='',stage='',type='',attacks=[];

 const num=text.match(/\b(?:\d{1,4}\/\d{1,4}|[A-Z]{1,4}\d{2,4})\b/);if(num)number=num[0];
 const st=text.match(/\b(BASIC|STAGE\s*[12]|MEGA\s*EVOLUTION)\b/i);if(st)stage=st[1];
 const ty=text.match(/\b(Fire|Water|Grass|Lightning|Psychic|Fighting|Darkness|Metal|Dragon|Colorless|Fairy)\b/i);if(ty)type=ty[1];
 const skip=/\b(?:pokemon|pokémon|trainer|energy|weakness|resistance|retreat|evolution|ability|rule|illustrator|basic|stage|damage|attack|supporter|item|stadium|tool|card|draw|deck|discard|opponent|bench|active|flip|coin|turn|search|shuffle|during|your|this|the|hp)\b/i;
 const clean=x=>x.replace(/^(?:BASIC|STAGE\s*[12]|MEGA\s*EVOLUTION|POKÉMON|POKEMON)\s*[:\-]?\s*/i,'').replace(/\s+(?:HP\s*\d{2,3}|\d{2,3}\s*HP)\b.*$/i,'').replace(/\s+/g,' ').trim();
 const candidates=[];
 const headerLines=String(headerText||'').split(/\r?\n/).map(x=>x.replace(/\s+/g,' ').trim()).filter(Boolean);
 const headerClean=x=>x.replace(/\b(?:BASIC|STAGE\s*[12]|POK[EÉ]MON)\b/gi,' ').replace(/\b(?:HP\s*)?\d{2,3}\s*(?:HP)?\b/gi,' ').replace(/[^A-Za-zÀ-ỹ0-9 .’'\-♀♂]/g,' ').replace(/\s+/g,' ').trim();
 for(const line of headerLines){const value=headerClean(line);if(value&&value.length>=3&&value.length<=32&&!/\b(?:weakness|resistance|retreat|ability|attack|trainer|energy|supporter)\b/i.test(value))candidates.push({value,score:30,i:0})}

 lines.slice(0,7).forEach((line,i)=>{const hpLine=/\bHP\s*\d{2,3}\b|\b\d{2,3}\s*HP\b/i.test(line),value=clean(line);
 if(!value||value.length<3||value.length>36||!/[A-Za-zÀ-ỹ]/.test(value)||skip.test(value)||/\d{3,}/.test(value)||!/^[A-Za-zÀ-ỹ][A-Za-zÀ-ỹ0-9 '.:’\-♀♂éÉ]*$/.test(value))return;
 const score=(hpLine?10:0)+(i<=2?4:0)+(i<=4?2:0)-(value.split(/\s+/).length>5?5:0);candidates.push({value,score,i})});
 candidates.sort((a,b)=>b.score-a.score||a.i-b.i);if(candidates.length&&candidates[0].score>=6)name=candidates[0].value;
 for(const line of lines){const m=line.match(/^([A-Za-z][A-Za-z '\-]{2,34}?)\s+(\d{1,3})([+x×]?)$/);if(m&&!/HP|weakness|resistance/i.test(m[1]))attacks.push({name:m[1],damage:m[2]+m[3]})}
 return{name,hp,number,stage,type,attacks:attacks.slice(0,3)};
}
function reviewScan(){let d=scanResult;let classification=detectCardClass(scanText,d),detected=classification.category;show('<h2>🔎 Kiểm tra thông tin nhận diện</h2><p>Tên thẻ được ưu tiên đọc ở phần đầu thẻ, gần HP. Hãy kiểm tra và sửa tên theo ảnh gốc trước khi lưu.</p><div class="scan-review"><img alt="Ảnh gốc thẻ" src="'+scanPhoto+'"><div><label>Loại thẻ <select id="scanCategory" onchange="updateClassHint(&quot;scan&quot;)"><option value="battle" '+(detected==='battle'?'selected':'')+'>Chiến đấu</option><option value="support" '+(detected==='support'?'selected':'')+'>Bổ trợ / tính năng</option><option value="unknown" '+(detected==='unknown'?'selected':'')+'>Chưa xác định</option></select></label><label>Phân nhóm thẻ bổ trợ<select id="scanSubtype" onchange="updateClassHint(&quot;scan&quot;)">'+Object.entries(BUM_TYPES).map(([v,t])=>'<option value="'+v+'" '+(classification.subtype===v?'selected':'')+'>'+t+'</option>').join('')+'</select></label><p id="scanClassHint" class="bum-class-hint">'+classificationHint(detected,classification.subtype)+'</p><label><input type="checkbox" id="scanVerified"> Đã đối chiếu ảnh gốc</label><label>Tên thẻ<input id="scanName" value="'+esc(d.name||'')+'"></label><label>HP<input id="scanHP" type="number" min="1" value="'+(d.hp||'')+'"></label><label>Hệ<input id="scanType" value="'+esc(d.type||'')+'"></label><label>Giai đoạn<input id="scanStage" value="'+esc(d.stage||'')+'"></label><label>Số thẻ<input id="scanNumber" value="'+esc(d.number||'')+'"></label><label>Nội dung hiệu ứng / hướng dẫn trên thẻ<textarea id="scanEffect" rows="4" placeholder="Nhập nguyên văn hiệu ứng trên thẻ">'+esc(d.hp>0?'':scanText||'')+'</textarea></label>'+ruleFieldHtml('scan',d)+'<label>Chiêu thức 1<input id="scanAttack" value="'+esc(d.attacks?.[0]?.name||'')+'"></label><label>Sát thương 1<input id="scanDamage" inputmode="numeric" value="'+esc(d.attacks?.[0]?.damage||'')+'"></label><label>Chiêu thức 2<input id="scanAttack2" value="'+esc(d.attacks?.[1]?.name||'')+'"></label><label>Sát thương 2<input id="scanDamage2" value="'+esc(d.attacks?.[1]?.damage||'')+'"></label></div></div><details><summary>Xem văn bản OCR để đối chiếu</summary><pre style="white-space:pre-wrap;overflow-wrap:anywhere">'+esc(scanText||'Không đọc được chữ')+'</pre></details><button onclick="saveScan()">✓ Xác nhận và lưu thẻ</button><button onclick="scanner()">Chụp lại</button><button onclick="collection()">Hủy</button>')}
function saveScan(){let v=id=>document.getElementById(id).value.trim(),name=v('scanName'),hp=Number(v('scanHP')),attack=v('scanAttack'),damageText=v('scanDamage');if(!name||(v('scanCategory')==='battle'&&(!Number.isFinite(hp)||hp<=0||!attack||!/^(\d+)$/.test(damageText))))return alert('Thẻ chiến đấu cần tên, HP, chiêu thức và sát thương; thẻ bổ trợ chỉ cần tên.');let damage=Number(damageText)||0;let card={category:v('scanCategory'),id:Date.now()+Math.random(),img:scanPhoto,name,hp,attack,damage,type:v('scanType'),stage:v('scanStage'),number:v('scanNumber'),attacks:[{name:attack,damage},...(v('scanAttack2')?[{name:v('scanAttack2'),damage:v('scanDamage2')}]:[])],ocrText:scanText,effectText:v('scanEffect'),subtype:v('scanSubtype'),...readRuleFields('scan'),verified:document.getElementById('scanVerified').checked};let previous=localStorage.getItem('bum_cards');cards.push(card);try{localStorage.setItem('bum_cards',JSON.stringify(cards));scanPhoto='';collection()}catch(e){cards.pop();if(previous!==null)try{localStorage.setItem('bum_cards',previous)}catch(_){}alert('Bộ nhớ trình duyệt đầy. Thẻ chưa được lưu; thử ảnh dung lượng nhỏ hơn hoặc sao lưu dữ liệu.')}}
function start(){players.forEach(p=>{p.team=[];p.ko=0});setupScreen()}function names(){players.forEach((p,i)=>p.name=document.getElementById('p'+i).value||('Người '+(i+1)));if(battleCards().length<3){alert('Cần ít nhất 3 thẻ chiến đấu để bắt đầu.');collection();return}drawTarget=3;players.forEach(p=>{p.team=[];p.support=[];p.ko=0});dodgeUsed=[false,false];supportDraw=0;draw=0;handoff()}function handoff(){rememberScreen('handoff');let p=players[draw];show('<h2>🔒 Đưa máy cho '+esc(p.name)+'</h2><p>Người còn lại không nhìn màn hình.</p><button onclick="pick()">Sẵn sàng</button>')}function pick(){rememberScreen('pick');let p=players[draw];show('<h2>'+esc(p.name)+' · Pokémon '+p.team.length+'/5</h2><p>Chọn tối thiểu 3 và tối đa 5 thẻ. Bạn có thể hoàn tất sau thẻ thứ 3.</p><div class="grid">'+battleCards().filter(c=>!p.team.some(t=>t.id===c.id)).map(c=>'<button onclick="take('+cards.indexOf(c)+')">'+esc(c.name)+' · HP '+c.hp+'</button>').join('')+'</div>'+(p.team.length>=3?'<button onclick="finishBattlePick()">✓ Hoàn tất đội hình ('+p.team.length+'/5)</button>':'')+'<button onclick="undoBattlePick()" '+(!p.team.length?'disabled':'')+'>↶ Bỏ thẻ vừa chọn</button>')}function take(i){if(!cards[i]||cardCategory(cards[i])!=='battle')return alert('Chỉ chọn thẻ chiến đấu.');let p=players[draw];if(p.team.some(c=>c.id===cards[i].id)){alert('Thẻ này đã chọn');return}if(p.team.length>=5)return alert('Tối đa 5 Pokémon.');p.team.push({...cards[i],current:cards[i].hp});if(p.team.length===5)finishBattlePick();else pick()}function undoBattlePick(){const p=players[draw];if(p&&p.team.length)p.team.pop();pick()}
function finishBattlePick(){const p=players[draw];if(!p||p.team.length<3||p.team.length>5)return alert('Chọn từ 3 đến 5 Pokémon.');draw++;if(draw<2)handoff();else{supportDraw=0;if(cards.some(c=>cardCategory(c)==='support'))supportHandoff();else{selected=0;starterHandoff()}}}
function supportHandoff(){rememberScreen('supportHandoff');const p=players[supportDraw];show('<h2>✨ Thẻ bổ trợ của '+esc(p.name)+'</h2><p>Chọn tối đa 2 thẻ bổ trợ, hoặc bỏ qua.</p><button onclick="supportPick()">Chọn thẻ bổ trợ</button><button onclick="finishSupportPick()">Bỏ qua</button>')}
function supportPick(){rememberScreen('supportPick');const p=players[supportDraw],available=cards.filter(c=>cardCategory(c)==='support'&&!p.support.some(x=>x.id===c.id));show('<h2>✨ '+esc(p.name)+' · '+p.support.length+'/2 thẻ bổ trợ</h2><p>Thẻ bổ trợ không tính vào 3–5 thẻ chiến đấu. Có thể sử dụng trong trận sau khi xác nhận nội dung và điều kiện ghi trên thẻ.</p><div class="grid">'+available.map(c=>'<button onclick="takeSupport('+cards.indexOf(c)+')">'+esc(c.name)+'</button>').join('')+'</div><button onclick="finishSupportPick()">Hoàn tất / Bỏ qua</button>')}
function takeSupport(i){const p=players[supportDraw],c=cards[i];if(!c||cardCategory(c)!=='support'||p.support.length>=2||p.support.some(x=>x.id===c.id))return;p.support.push({...c});if(p.support.length>=2)finishSupportPick();else supportPick()}
function finishSupportPick(){supportDraw++;if(supportDraw<2)supportHandoff();else{selected=0;starterHandoff()}}
function starterHandoff(){rememberScreen('starterHandoff');show('<h2>🔒 '+esc(players[selected].name)+' chọn thẻ ra sân</h2><button onclick="starter()">Sẵn sàng</button>')}function starter(){rememberScreen('starter');show('<h2>Chọn thẻ đầu tiên</h2>'+players[selected].team.map((c,i)=>'<button onclick="choose('+i+')">'+esc(c.name)+'</button>').join(''))}function choose(i){let t=players[selected].team;[t[0],t[i]]=[t[i],t[0]];selected++;if(selected<2)starterHandoff();else{turn=0;guard=[false,false];dodgeUsed=[false,false];battle()}}function supportEffectText(c){return String(c.effectText||c.ocrText||'').trim()}
function playSupport(i){const p=players[turn],c=(p.support||[])[i];if(!c)return;const info=supportEffectText(c);if(!info){alert('Thẻ chưa có nội dung hiệu ứng. Hãy kiểm tra ảnh thẻ trước khi sử dụng.');return}const ok=confirm('THẺ BỔ TRỢ: '+c.name+'\n\nNỘI DUNG TRÊN THẺ:\n'+info+'\n\nChỉ xác nhận khi điều kiện ghi trên thẻ được đáp ứng. Sử dụng thẻ này và chuyển lượt?');if(!ok)return;const d=prompt('Thay đổi HP cho Pokémon đang ra sân (số dương để hồi, số âm để trừ, bỏ trống nếu không có):','');if(d===null)return;const n=d.trim()?Number(d):0;if(!Number.isFinite(n)||!Number.isInteger(n)){alert('HP thay đổi phải là số nguyên.');return}const active=p.team[0];if(n<0&&active.current+n<=0){alert('Không thể KO Pokémon của mình bằng thao tác này.');return}active.current=Math.max(1,Math.min(active.hp,active.current+n));p.support.splice(i,1);turn=1-turn;battle();alert('Đã sử dụng '+c.name+'. Hãy thực hiện các hiệu ứng khác theo đúng nội dung thẻ nếu có.')}
function battle(){
rememberScreen('battle');
const a=players[turn],b=players[1-turn],c=a.team[0],d=b.team[0];
const side=(p,card,idx)=>{const pct=Math.max(0,Math.min(100,Math.round(100*card.current/Math.max(1,card.hp))));return '<article class="battle-fighter player-'+idx+'"><div class="fighter-trainer">'+portraitTag(p.avatar,'mini-avatar')+'<span>'+esc(p.name)+'</span></div><div class="fighter-art">'+(card.img?'<img src="'+card.img+'" alt="Thẻ '+esc(card.name)+'">':'<div class="fighter-placeholder">🎴<small>Ảnh thẻ sẽ xuất hiện tại đây</small></div>')+'</div><strong class="fighter-pokemon">'+esc(card.name)+'</strong><div class="fighter-hp-line"><span>HP</span><b>'+card.current+' / '+card.hp+'</b></div><div class="fighter-hp-track"><span style="width:'+pct+'%"></span></div><small>'+p.team.length+' thẻ còn lại · '+p.ko+' KO</small></article>'};
show('<div class="battle-view"><div class="battle-eyebrow">⚡ SÂN ĐẤU GIA ĐÌNH ⚡</div><h2>Lượt của '+esc(a.name)+'</h2><div class="battle-match">'+side(players[0],players[0].team[0],0)+'<div class="battle-versus">VS</div>'+side(players[1],players[1].team[0],1)+'</div><div class="battle-action-panel"><div class="battle-move"><span>Đòn đánh</span><strong>'+esc(c.attack||'Chưa cập nhật')+'</strong><small>Sát thương cơ bản: '+c.damage+' · nhập sát thương thực tế khi tấn công</small></div><div class="battle-support-status">'+players.map((p,i)=>'<div class="battle-support-player"><strong>'+esc(p.name)+'</strong><span>✨ Bổ trợ: '+(p.support||[]).length+'/2</span><span>💨 Né tránh: '+(dodgeUsed[i]?'Đã dùng':'Còn 1 lần')+'</span></div>').join('')+'</div><div class="battle-support-hand"><strong>✨ Thẻ bổ trợ đang có</strong><div class="battle-support-list>'+((a.support||[]).length?a.support.map((sc,i)=>'<button type="button" onclick="playSupport('+i+')">'+esc(sc.name)+' · Xem & sử dụng</button>').join(''):'<span>Không có thẻ bổ trợ</span>')+'</div></div><div class="battle-buttons"><button onclick="attack()">⚔️ Tấn công</button><button onclick="defend()">🛡️ Phòng thủ</button><button onclick="swap(false)">🔄 Đổi thẻ</button></div><p class="battle-note">Tiến hóa: đang chuẩn bị cơ chế ghép thẻ tiến hóa và giữ nguyên sát thương đã nhận. Chưa kích hoạt để tránh sai luật khi thử thẻ thật.</p></div></div>');
}
function playDodgeEffect(playerIndex){
 const root=document.querySelector('#root .battle-view');if(!root)return;
 const fighter=root.querySelector('.battle-fighter.player-'+playerIndex);
 if(fighter){fighter.classList.remove('bum-dodge-active');void fighter.offsetWidth;fighter.classList.add('bum-dodge-active')}
 const banner=document.createElement('div');banner.className='bum-dodge-banner';banner.setAttribute('role','status');banner.innerHTML='<span class="bum-dodge-spark">✦ ✧ ✦</span><strong>DODGE!</strong><span>NÉ TRÁNH THÀNH CÔNG</span><small>'+esc(players[playerIndex].name)+' · Pokémon không mất HP</small>';
 root.appendChild(banner);
 banner.addEventListener('animationend',e=>{if(e.target===banner)banner.remove()},{once:true});
}
function attack(){let c=players[turn].team[0],d=players[1-turn].team[0];let s=prompt('Nhập sát thương thực tế sau khi áp dụng hiệu ứng thẻ:',c.damage);if(s===null)return;let n=Number(s);if(!Number.isFinite(n)||n<0)return alert('Sát thương không hợp lệ');n=Math.floor(n);if(guard[1-turn]){n=Math.max(0,n-30);guard[1-turn]=false}if(!dodgeUsed[1-turn]&&n>0&&Math.random()<0.2){dodgeUsed[1-turn]=true;guard[1-turn]=false;const dodger=1-turn;turn=1-turn;battle();playDodgeEffect(dodger);return}d.current=Math.max(0,d.current-n);if(!d.current){players[turn].ko++;players[1-turn].team.shift();if(players[turn].ko>=3||!players[1-turn].team.length)return win(turn);turn=1-turn;return swap(true)}turn=1-turn;battle()}function defend(){guard[turn]=true;turn=1-turn;battle()}function swap(forced){rememberScreen('swap',forced);let p=players[turn];show('<h2>'+esc(p.name)+' chọn thẻ thay thế</h2>'+p.team.map((c,i)=>'<button onclick="swapTo('+i+','+forced+')">'+esc(c.name)+' · '+c.current+' HP</button>').join('')+(forced?'':'<button onclick="battle()">Hủy</button>'))}function swapTo(i,forced){if(!forced&&i===0)return battle();let t=players[turn].team;[t[0],t[i]]=[t[i],t[0]];if(!forced)turn=1-turn;battle()}function win(i){rememberScreen('win',i);show('<h2>🏆 CHIẾN THẮNG!</h2><h1>'+esc(players[i].name)+'</h1><p>'+players[i].ko+' KO</p><button onclick="start()">Chơi lại</button><button onclick="home()">'+uiIcon('home')+' Trang chủ</button>')}if(!restoreScreen())home();
</script></html>
