const randomPlayerNames=['Bé Bum','Bum Siêu Sao','Nhà Vô Địch','Chiến Binh Xanh','Huấn Luyện Viên','Thần Tốc','Ngôi Sao Nhỏ','Đội Trưởng','Tia Chớp','Rồng Lửa','Bão Sấm','Siêu Nhân Bum','Người Hùng','Huyền Thoại'];function randomAvatar(i){let el=document.getElementById('p'+i);if(el)players[i].name=el.value;let pool=avatars.map((_,j)=>j).filter(j=>j!==players[1-i].avatar);players[i].avatar=pool[Math.floor(Math.random()*pool.length)];let names=randomPlayerNames.filter(n=>n!==players[1-i].name);players[i].name=names[Math.floor(Math.random()*names.length)];setupScreen()}
function setupScreen(){rememberScreen('setupScreen');show('<h2 class="heading-icon">'+uiIcon('users')+' Chọn nhân vật (14 lựa chọn)</h2>'+players.map((p,i)=>'<div class="player-setup"><div class="player-setup-toolbar"><h3>Người chơi '+(i+1)+'</h3><label class="player-name-input"><input aria-label="Tên người chơi" placeholder="Nhập tên người chơi" id="p'+i+'" maxlength="24" value="'+esc(p.name)+'"></label><button type="button" class="random-player-btn" onclick="randomAvatar('+i+')">'+uiIcon('dice')+' Ngẫu nhiên tên + nhân vật</button></div>'+renderAvatars(i)+'</div>').join('')+'<div class="setup-actions"><button onclick="finishAvatarSelection()">'+uiIcon('check')+' Đã chọn xong nhân vật</button><button onclick="names()">'+uiIcon('arrow')+' Tiếp tục chọn thẻ</button><button onclick="home()">'+uiIcon('home')+' Trang chủ</button></div>')}
function finishAvatarSelection(){players.forEach((p,i)=>{let el=document.getElementById('p'+i);if(el)p.name=el.value.trim()||('Người chơi '+(i+1))});home()}
function home(){rememberScreen('home');show('<div class="arena"><div class="arena-label">SÂN ĐẤU GIA ĐÌNH</div><div class="fighter left">'+portraitTag(players[0].avatar)+'</div><span class="versus">VS</span><div class="fighter right">'+portraitTag(players[1].avatar)+'</div><span class="player-name left">'+esc(players[0].name)+'</span><span class="player-name right">'+esc(players[1].name)+'</span></div><section class="command-center" aria-label="Bảng điều khiển trận đấu"><div class="command-heading"><span class="command-star">✦</span> BATTLE COMMAND CENTER <span class="command-star">✦</span></div><div class="command-grid"><button class="command-btn command-start" onclick="start()"><span class="pokeball pokeball-red" aria-hidden="true"></span><span class="command-copy"><strong>BẮT ĐẦU TRẬN ĐẤU</strong><small>Thách đấu ngay · 2 người chơi</small></span><span class="command-chevron" aria-hidden="true">›</span></button><button class="command-btn command-collection" onclick="collection()"><span class="pokeball pokeball-blue" aria-hidden="true"></span><span class="command-copy"><strong>BỘ SƯU TẬP THẺ</strong><small>Quản lý thẻ Pokémon</small></span><span class="command-chevron" aria-hidden="true">›</span></button><button class="command-btn command-avatars" onclick="setupScreen()"><span class="pokeball pokeball-ultra" aria-hidden="true"></span><span class="command-copy"><strong>CHỌN NHÂN VẬT</strong><small>14 nhân vật anime</small></span><span class="command-chevron" aria-hidden="true">›</span></button></div><div class="command-footer">✧ Bé BUM POKÉMON · Family Battle ✧</div></section>');root.classList.add('home-screen')} function collection(){rememberScreen('collection');show('<h2>Bộ sưu tập ('+cards.length+')</h2><div class="collection-actions"><button onclick="viewUploadedCards()">'+uiIcon('cards')+' Xem thẻ đã tải lên ('+cards.length+')</button><button onclick="add()">'+uiIcon('plus')+' Thêm thẻ</button><button onclick="home()">'+uiIcon('home')+' Trang chủ</button></div><p class="collection-hint">Thẻ đã lưu trên thiết bị này: '+cards.length+' thẻ.</p>'+(cards.length?'<div class="grid">'+cards.slice(0,6).map((c,i)=>'<button class="collection-preview-card" onclick="viewCardDetail('+i+')">'+(c.img?'<img src="'+c.img+'" alt="Ảnh thẻ '+esc(c.name)+'">':'<span>🎴</span>')+'<strong>'+esc(c.name)+'</strong></button>').join('')+'</div>':'<div class="collection-empty">Chưa có thẻ nào được lưu trên trình duyệt này. Nhấn “Thêm thẻ” để chụp hoặc tải ảnh thẻ lên.</div>'))}
function viewUploadedCards(){rememberScreen('viewUploadedCards');show('<h2>'+uiIcon('cards')+' Thẻ đã tải lên ('+cards.length+')</h2><div class="collection-actions"><button onclick="collection()">'+uiIcon('arrow')+' Bộ sưu tập</button><button onclick="add()">'+uiIcon('plus')+' Thêm thẻ</button><button onclick="home()">'+uiIcon('home')+' Trang chủ</button></div>'+(cards.length?'<div class="uploaded-card-grid">'+cards.map((c,i)=>'<button class="uploaded-card" onclick="viewCardDetail('+i+')">'+(c.img?'<img src="'+c.img+'" alt="Ảnh thẻ '+esc(c.name)+'">':'<span class="card-placeholder">🎴</span>')+'<strong>'+esc(c.name)+'</strong><small>HP '+esc(String(c.hp))+'</small></button>').join('')+'</div>':'<div class="collection-empty">Chưa tìm thấy thẻ đã tải lên trong bộ nhớ của trình duyệt này. Nếu bạn tải trên máy khác, dữ liệu chưa tự đồng bộ giữa các thiết bị.</div>'))}
function viewCardDetail(i){rememberScreen('viewCardDetail',i);const c=cards[i];if(!c)return viewUploadedCards();show('<h2>🎴 '+esc(c.name)+'</h2><div class="collection-actions"><button onclick="viewUploadedCards()">'+uiIcon('arrow')+' Xem tất cả thẻ</button><button onclick="home()">'+uiIcon('home')+' Trang chủ</button></div><div class="uploaded-card-detail">'+(c.img?'<img src="'+c.img+'" alt="Ảnh thẻ '+esc(c.name)+'">':'<div class="card-placeholder">🎴</div>')+'<div><h3>'+esc(c.name)+'</h3><p>HP: '+esc(String(c.hp))+'</p><p>Đòn đánh: '+esc(c.attack||'Chưa cập nhật')+'</p><p>Sát thương: '+esc(String(c.damage??0))+'</p></div></div>')}
let scanPhoto='',scanText='',scanResult={};
function scanner(){rememberScreen('scanner');show('<h2>📸 Quét thẻ mới</h2><p>Chụp rõ toàn bộ thẻ, tránh phản chiếu ánh sáng và giữ chữ thẳng.</p><div class="scan-actions"><label class="scan-button">📷 Chụp trực tiếp<input id="camera" type="file" accept="image/*" capture="environment" hidden></label><label class="scan-button">🖼️ Chọn từ thiết bị<input id="gallery" type="file" accept="image/*" hidden></label></div><div id="scanStatus" role="status">Chọn một ảnh để bắt đầu.</div><div id="scanPreview"></div><button onclick="collection()">Quay lại bộ sưu tập</button>');['camera','gallery'].forEach(id=>document.getElementById(id).addEventListener('change',e=>{if(e.target.files[0])scanFile(e.target.files[0])}))}
function add(){scanner()}
function loadOCR(){return new Promise((resolve,reject)=>{if(window.Tesseract)return resolve();let s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';s.onload=()=>window.Tesseract?resolve():reject(new Error('Không tải được thư viện nhận diện'));s.onerror=()=>reject(new Error('Không thể tải thư viện OCR. Cần kết nối Internet.'));document.head.appendChild(s)})}
function shrinkImage(file){return new Promise((resolve,reject)=>{let reader=new FileReader();reader.onerror=()=>reject(new Error('Không đọc được ảnh'));reader.onload=()=>{let img=new Image();img.onerror=()=>reject(new Error('Ảnh không hợp lệ'));img.onload=()=>{let max=1400,scale=Math.min(1,max/Math.max(img.width,img.height)),cv=document.createElement('canvas');cv.width=Math.round(img.width*scale);cv.height=Math.round(img.height*scale);cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);resolve(cv.toDataURL('image/jpeg',.78))};img.src=reader.result};reader.readAsDataURL(file)})}
async function scanFile(file){let status=document.getElementById('scanStatus');status.textContent='Đang chuẩn bị ảnh...';try{scanPhoto=await shrinkImage(file);document.getElementById('scanPreview').innerHTML='<img alt="Ảnh thẻ vừa chụp" style="width:100%;max-width:320px;max-height:420px;object-fit:contain;border-radius:12px" src="'+scanPhoto+'">';status.textContent='Đang tải công cụ nhận diện chữ...';await loadOCR();status.textContent='Đang đọc chữ trên thẻ. Có thể mất 10–30 giây ở lần đầu...';let worker=await Tesseract.createWorker('eng');try{let out=await worker.recognize(scanPhoto);scanText=out.data.text||''}finally{await worker.terminate()}scanResult=parseScan(scanText);reviewScan()}catch(e){status.textContent='Không thể nhận diện tự động: '+e.message;let b=document.createElement('button');b.textContent='Xem ảnh và kiểm tra thủ công';b.onclick=()=>{scanText='';scanResult={};reviewScan()};status.appendChild(b)}}
function parseScan(text){let lines=text.split(/\r?\n/).map(x=>x.trim()).filter(Boolean),name='',hp=0,number='',stage='',type='',attacks=[];let h=text.match(/\bHP\s*[:.]?\s*(\d{2,3})\b/i)||text.match(/\b(\d{2,3})\s*HP\b/i);if(h)hp=+h[1];let num=text.match(/\b(?:\d{1,4}\/\d{1,4}|[A-Z]{1,4}\d{2,4})\b/);if(num)number=num[0];let st=text.match(/\b(BASIC|STAGE\s*[12]|MEGA\s*EVOLUTION)\b/i);if(st)stage=st[1];let ty=text.match(/\b(Fire|Water|Grass|Lightning|Psychic|Fighting|Darkness|Metal|Dragon|Colorless|Fairy)\b/i);if(ty)type=ty[1];for(let line of lines.slice(0,9)){let m=line.match(/^(?:BASIC|STAGE\s*[12]|MEGA)?\s*([A-Za-z][A-Za-z '.-]{2,28})(?:\s+HP\s*\d+)?$/i);if(m&&!/pokemon|trainer|energy|weakness|resistance|retreat|evolution|ability|rule|illustrator|basic|stage/i.test(m[1])){name=m[1].trim();break}}for(let line of lines){let m=line.match(/^([A-Za-z][A-Za-z '\-]{2,34}?)\s+(\d{1,3})([+x×]?)$/);if(m&&!/HP|weakness|resistance/i.test(m[1]))attacks.push({name:m[1],damage:m[2]+m[3]})}return{name,hp,number,stage,type,attacks:attacks.slice(0,3)}}
function reviewScan(){let d=scanResult;show('<h2>🔎 Kiểm tra thông tin nhận diện</h2><p>Hệ thống đã đọc ảnh. Hãy kiểm tra với chữ in trên thẻ trước khi lưu. Trường chưa rõ được để trống, không tự tạo dữ liệu.</p><div class="scan-review"><img alt="Ảnh gốc thẻ" src="'+scanPhoto+'"><div><label>Tên thẻ<input id="scanName" value="'+esc(d.name||'')+'"></label><label>HP<input id="scanHP" type="number" min="1" value="'+(d.hp||'')+'"></label><label>Hệ<input id="scanType" value="'+esc(d.type||'')+'"></label><label>Giai đoạn<input id="scanStage" value="'+esc(d.stage||'')+'"></label><label>Số thẻ<input id="scanNumber" value="'+esc(d.number||'')+'"></label><label>Chiêu thức 1<input id="scanAttack" value="'+esc(d.attacks?.[0]?.name||'')+'"></label><label>Sát thương 1<input id="scanDamage" inputmode="numeric" value="'+esc(d.attacks?.[0]?.damage||'')+'"></label><label>Chiêu thức 2<input id="scanAttack2" value="'+esc(d.attacks?.[1]?.name||'')+'"></label><label>Sát thương 2<input id="scanDamage2" value="'+esc(d.attacks?.[1]?.damage||'')+'"></label></div></div><details><summary>Xem văn bản OCR để đối chiếu</summary><pre style="white-space:pre-wrap;overflow-wrap:anywhere">'+esc(scanText||'Không đọc được chữ')+'</pre></details><button onclick="saveScan()">✓ Xác nhận và lưu thẻ</button><button onclick="scanner()">Chụp lại</button><button onclick="collection()">Hủy</button>')}
function saveScan(){let v=id=>document.getElementById(id).value.trim(),name=v('scanName'),hp=Number(v('scanHP')),attack=v('scanAttack'),damageText=v('scanDamage');if(!name||!Number.isFinite(hp)||hp<=0||!attack||!/^(\d+)$/.test(damageText))return alert('Vui lòng xác nhận tên, HP, chiêu thức và sát thương. Không lưu thông tin chưa xác minh.');let damage=Number(damageText);let card={id:Date.now()+Math.random(),img:scanPhoto,name,hp,attack,damage,type:v('scanType'),stage:v('scanStage'),number:v('scanNumber'),attacks:[{name:attack,damage},...(v('scanAttack2')?[{name:v('scanAttack2'),damage:v('scanDamage2')}]:[])],ocrText:scanText};let previous=localStorage.getItem('bum_cards');cards.push(card);try{localStorage.setItem('bum_cards',JSON.stringify(cards));scanPhoto='';collection()}catch(e){cards.pop();if(previous!==null)try{localStorage.setItem('bum_cards',previous)}catch(_){}alert('Bộ nhớ trình duyệt đầy. Thẻ chưa được lưu; thử ảnh dung lượng nhỏ hơn hoặc sao lưu dữ liệu.')}}
function start(){players.forEach(p=>{p.team=[];p.ko=0});setupScreen()}function names(){players.forEach((p,i)=>p.name=document.getElementById('p'+i).value||('Người '+(i+1)));if(cards.length<5){alert('Cần ít nhất 5 thẻ trong bộ sưu tập để bắt đầu.');collection();return}draw=0;handoff()}function handoff(){rememberScreen('handoff');let p=players[draw%2];show('<h2>🔒 Đưa máy cho '+esc(p.name)+'</h2><p>Người còn lại không nhìn màn hình.</p><button onclick="pick()">Sẵn sàng</button>')}function pick(){rememberScreen('pick');let p=players[draw%2];show('<h2>'+esc(p.name)+' · Thẻ '+(p.team.length+1)+'/5</h2><div class="grid">'+cards.map((c,i)=>'<button onclick="take('+i+')">'+esc(c.name)+' · HP '+c.hp+'</button>').join('')+'</div>')}function take(i){let p=players[draw%2];if(p.team.some(c=>c.id===cards[i].id)){alert('Thẻ này đã chọn');return}p.team.push({...cards[i],current:cards[i].hp});draw++;if(draw<10)handoff();else{selected=0;starterHandoff()}}function starterHandoff(){rememberScreen('starterHandoff');show('<h2>🔒 '+esc(players[selected].name)+' chọn thẻ ra sân</h2><button onclick="starter()">Sẵn sàng</button>')}function starter(){rememberScreen('starter');show('<h2>Chọn thẻ đầu tiên</h2>'+players[selected].team.map((c,i)=>'<button onclick="choose('+i+')">'+esc(c.name)+'</button>').join(''))}function choose(i){let t=players[selected].team;[t[0],t[i]]=[t[i],t[0]];selected++;if(selected<2)starterHandoff();else{turn=0;guard=[false,false];battle()}}function battle(){rememberScreen('battle');let a=players[turn],b=players[1-turn],c=a.team[0],d=b.team[0];show('<h2>⚔️ Lượt '+portraitTag(a.avatar,'mini-avatar')+esc(a.name)+'</h2><div class="grid"><div class="tile"><h3>'+esc(a.name)+'</h3>'+esc(c.name)+'<p>HP '+c.current+'/'+c.hp+'</p></div><div class="tile"><h3>'+esc(b.name)+'</h3>'+esc(d.name)+'<p>HP '+d.current+'/'+d.hp+'</p></div></div><p>KO: '+a.ko+' – '+b.ko+'</p><p>Chiêu '+esc(c.attack)+' · '+c.damage+' sát thương cơ bản</p><button onclick="attack()">Tấn công</button><button onclick="defend()">Phòng thủ</button><button onclick="swap(false)">Đổi thẻ</button>')}function attack(){let c=players[turn].team[0],d=players[1-turn].team[0];let s=prompt('Nhập sát thương thực tế sau khi áp dụng hiệu ứng thẻ:',c.damage);if(s===null)return;let n=Number(s);if(!Number.isFinite(n)||n<0)return alert('Sát thương không hợp lệ');n=Math.floor(n);if(guard[1-turn]){n=Math.max(0,n-30);guard[1-turn]=false}d.current=Math.max(0,d.current-n);if(!d.current){players[turn].ko++;players[1-turn].team.shift();if(players[turn].ko>=3||!players[1-turn].team.length)return win(turn);turn=1-turn;return swap(true)}turn=1-turn;battle()}function defend(){guard[turn]=true;turn=1-turn;battle()}function swap(forced){rememberScreen('swap',forced);let p=players[turn];show('<h2>'+esc(p.name)+' chọn thẻ thay thế</h2>'+p.team.map((c,i)=>'<button onclick="swapTo('+i+','+forced+')">'+esc(c.name)+' · '+c.current+' HP</button>').join('')+(forced?'':'<button onclick="battle()">Hủy</button>'))}function swapTo(i,forced){if(!forced&&i===0)return battle();let t=players[turn].team;[t[0],t[i]]=[t[i],t[0]];if(!forced)turn=1-turn;battle()}function win(i){rememberScreen('win',i);show('<h2>🏆 CHIẾN THẮNG!</h2><h1>'+esc(players[i].name)+'</h1><p>'+players[i].ko+' KO</p><button onclick="start()">Chơi lại</button><button onclick="home()">'+uiIcon('home')+' Trang chủ</button>')}if(!restoreScreen())home();
</script></html>
