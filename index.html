<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bé Bum – Thẻ Chiến Đấu 2D</title><style>body{background:#102448;color:white;font:16px system-ui;margin:0}main{max-width:750px;margin:auto;padding:18px}h1{color:#ffd56b}section{background:#193965;border-radius:15px;padding:18px;margin:12px 0}button{background:#ffd56b;color:#12274c;border:0;border-radius:9px;padding:12px;margin:4px;font-weight:bold}input{padding:9px;margin:5px;max-width:90%}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.tile{background:#28558a;border-radius:9px;padding:12px}.tile img{max-width:100%;height:140px;object-fit:contain}</style><main><h1>✨ Bé Bum – Thẻ Chiến Đấu 2D</h1><div id="root"></div></main><script>
let cards=JSON.parse(localStorage.getItem('bum_cards')||'[]'),players=[{name:'Bé Bum',team:[],ko:0},{name:'Ba',team:[],ko:0}],turn=0,draw=0,selected=0,guard=[false,false];const root=document.getElementById('root');function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;':'&quot;'}[c]))}function show(s){root.innerHTML='<section>'+s+'</section>'}function home(){show('<h2>Trò chơi 2 người trên một thiết bị</h2><button onclick="collection()">📚 Bộ sưu tập</button><button onclick="start()">⚔️ Bắt đầu trận đấu</button><p>Ảnh và dữ liệu thẻ lưu trong trình duyệt. Phiên bản thử nghiệm chưa tự nhận diện thẻ hoặc xử lý hiệu ứng nâng cao.</p>')}function collection(){show('<h2>Bộ sưu tập ('+cards.length+')</h2><button onclick="add()">+ Thêm thẻ</button><button onclick="home()">Trang chủ</button><div class="grid">'+cards.map(c=>'<div class="tile">'+(c.img?'<img src="'+c.img+'">':'🎴')+'<p>'+esc(c.name)+'</p>HP '+c.hp+' · '+esc(c.attack)+' ('+c.damage+')</div>').join('')+'</div>')}function add(){show('<h2>Thêm thẻ thật</h2><form id="f"><p>Ảnh: <input id="img" type="file" accept="image/*"></p><p>Tên: <input id="name" required></p><p>HP: <input id="hp" type="number" min="1" required></p><p>Chiêu thức: <input id="attack" required></p><p>Sát thương: <input id="damage" type="number" min="0" required></p><button>Lưu</button></form>');document.getElementById('f').onsubmit=async e=>{e.preventDefault();let f=document.getElementById('img').files[0],img='';if(f)img=await new Promise(ok=>{let r=new FileReader;r.onload=()=>ok(r.result);r.readAsDataURL(f)});cards.push({id:Date.now()+Math.random(),img,name:document.getElementById('name').value,hp:+document.getElementById('hp').value,attack:document.getElementById('attack').value,damage:+document.getElementById('damage').value});try{localStorage.setItem('bum_cards',JSON.stringify(cards))}catch(e){alert('Bộ nhớ trình duyệt đầy')}collection()}}function start(){if(cards.length<5){alert('Hãy nhập ít nhất 5 thẻ trước');collection();return}players.forEach(p=>{p.team=[];p.ko=0});show('<h2>Chọn người chơi</h2><p>Người 1 <input id="p0" value="Bé Bum"></p><p>Người 2 <input id="p1" value="Ba"></p><button onclick="names()">Tiếp tục</button>')}function names(){players.forEach((p,i)=>p.name=document.getElementById('p'+i).value||('Người '+(i+1)));draw=0;handoff()}function handoff(){let p=players[draw%2];show('<h2>🔒 Đưa máy cho '+esc(p.name)+'</h2><p>Người còn lại không nhìn màn hình.</p><button onclick="pick()">Sẵn sàng</button>')}function pick(){let p=players[draw%2];show('<h2>'+esc(p.name)+' · Thẻ '+(p.team.length+1)+'/5</h2><div class="grid">'+cards.map((c,i)=>'<button onclick="take('+i+')">'+esc(c.name)+' · HP '+c.hp+'</button>').join('')+'</div>')}function take(i){let p=players[draw%2];if(p.team.some(c=>c.id===cards[i].id)){alert('Thẻ này đã chọn');return}p.team.push({...cards[i],current:cards[i].hp});draw++;if(draw<10)handoff();else{selected=0;starterHandoff()}}function starterHandoff(){show('<h2>🔒 '+esc(players[selected].name)+' chọn thẻ ra sân</h2><button onclick="starter()">Sẵn sàng</button>')}function starter(){show('<h2>Chọn thẻ đầu tiên</h2>'+players[selected].team.map((c,i)=>'<button onclick="choose('+i+')">'+esc(c.name)+'</button>').join(''))}function choose(i){let t=players[selected].team;[t[0],t[i]]=[t[i],t[0]];selected++;if(selected<2)starterHandoff();else{turn=0;guard=[false,false];battle()}}function battle(){let a=players[turn],b=players[1-turn],c=a.team[0],d=b.team[0];show('<h2>⚔️ Lượt '+esc(a.name)+'</h2><div class="grid"><div class="tile"><h3>'+esc(a.name)+'</h3>'+esc(c.name)+'<p>HP '+c.current+'/'+c.hp+'</p></div><div class="tile"><h3>'+esc(b.name)+'</h3>'+esc(d.name)+'<p>HP '+d.current+'/'+d.hp+'</p></div></div><p>KO: '+a.ko+' – '+b.ko+'</p><p>Chiêu '+esc(c.attack)+' · '+c.damage+' sát thương cơ bản</p><button onclick="attack()">Tấn công</button><button onclick="defend()">Phòng thủ</button><button onclick="swap(false)">Đổi thẻ</button>')}function attack(){let c=players[turn].team[0],d=players[1-turn].team[0];let s=prompt('Nhập sát thương thực tế sau khi áp dụng hiệu ứng thẻ:',c.damage);if(s===null)return;let n=Number(s);if(!Number.isFinite(n)||n<0)return alert('Sát thương không hợp lệ');n=Math.floor(n);if(guard[1-turn]){n=Math.max(0,n-30);guard[1-turn]=false}d.current=Math.max(0,d.current-n);if(!d.current){players[turn].ko++;players[1-turn].team.shift();if(players[turn].ko>=3||!players[1-turn].team.length)return win(turn);turn=1-turn;return swap(true)}turn=1-turn;battle()}function defend(){guard[turn]=true;turn=1-turn;battle()}function swap(forced){let p=players[turn];show('<h2>'+esc(p.name)+' chọn thẻ thay thế</h2>'+p.team.map((c,i)=>'<button onclick="swapTo('+i+','+forced+')">'+esc(c.name)+' · '+c.current+' HP</button>').join('')+(forced?'':'<button onclick="battle()">Hủy</button>'))}function swapTo(i,forced){if(!forced&&i===0)return battle();let t=players[turn].team;[t[0],t[i]]=[t[i],t[0]];if(!forced)turn=1-turn;battle()}function win(i){show('<h2>🏆 CHIẾN THẮNG!</h2><h1>'+esc(players[i].name)+'</h1><p>'+players[i].ko+' KO</p><button onclick="start()">Chơi lại</button><button onclick="home()">Trang chủ</button>')}home();
</script></html>
